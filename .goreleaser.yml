version: 2
project_name: helm-docs
before:
  hooks:
    - go mod download
builds:
  - main: ./cmd/helm-docs
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - 6
      - 7
    goos:
      - darwin
      - linux
      - windows
archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm" }}{{ .Arch }}{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt
snapshot:
  name_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers:
  - goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - --platform=linux/amd64
    image_templates:
      - ghcr.io/makeshift/{{ .ProjectName }}:{{ .Tag }}-amd64
  - goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - --platform=linux/arm64
    image_templates:
      - ghcr.io/makeshift/{{ .ProjectName }}:{{ .Tag }}-arm64
  - goos: linux
    goarch: arm
    goarm: 6
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - --platform=linux/arm/v6
    image_templates:
      - ghcr.io/makeshift/{{ .ProjectName }}:{{ .Tag }}-arm64v6
  - goos: linux
    goarch: arm
    goarm: 7
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - --platform=linux/arm/v7
    image_templates:
      - ghcr.io/makeshift/{{ .ProjectName }}:{{ .Tag }}-arm64v7
docker_manifests:
- name_template: ghcr.io/makeshift/{{ .ProjectName }}:{{ .Tag }}
  image_templates:
    - ghcr.io/makeshift/{{ .ProjectName }}:{{ .Tag }}-amd64
    - ghcr.io/makeshift/{{ .ProjectName }}:{{ .Tag }}-arm64
    - ghcr.io/makeshift/{{ .ProjectName }}:{{ .Tag }}-arm64v6
    - ghcr.io/makeshift/{{ .ProjectName }}:{{ .Tag }}-arm64v7
- name_template: ghcr.io/makeshift/{{ .ProjectName }}:latest
  image_templates:
    - ghcr.io/makeshift/{{ .ProjectName }}:{{ .Tag }}-amd64
    - ghcr.io/makeshift/{{ .ProjectName }}:{{ .Tag }}-arm64
    - ghcr.io/makeshift/{{ .ProjectName }}:{{ .Tag }}-arm64v6
    - ghcr.io/makeshift/{{ .ProjectName }}:{{ .Tag }}-arm64v7
